name: Build Full PvZ APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GODOT_VERSION: 4.5.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      - name: Install Android SDK bits if missing
        run: |
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMAN" ]; then SDKMAN=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1); fi
          yes | "$SDKMAN" --licenses >/dev/null 2>&1 || true
          "$SDKMAN" "platform-tools" "build-tools;34.0.0" "platforms;android-34" >/dev/null 2>&1 || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Download Godot and export templates
        run: |
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable | head
          wget -q -O /tmp/font.otf "https://github.com/googlefonts/noto-cjk/raw/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf"
          ls -lh /tmp/font.otf

      - name: Download expert release and clone source
        run: |
          wget -q -O /tmp/release.zip "https://github.com/hsk-dream/PVZ-Godot_dream/releases/download/v1.1.1/pvz_godot._v1.1.1.zip"
          mkdir -p /tmp/release && unzip -q /tmp/release.zip -d /tmp/release
          PCK=$(find /tmp/release -name '*.pck' | head -1)
          echo "PCK=$PCK" >> $GITHUB_ENV
          git clone --depth 1 --branch v1.1.1 https://github.com/hsk-dream/PVZ-Godot_dream.git project
          rm -rf project/.git
          mkdir -p project/assets/fonts
          ls project | head

      - name: Unzip build scripts
        run: |
          mkdir -p scripts
          unzip -q build_scripts.zip -d scripts
          ls scripts

      - name: Extract all assets from PCK
        run: |
          ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless \
            --path scripts/extract_proj --script res://extract_pck.gd \
            -- "$PCK" "$GITHUB_WORKSPACE/project"
          echo "--- extracted ---"
          find project/assets -name '*.png' | wc -l
          find project/assets -name '*.jpg' | wc -l
          find project/assets -name '*.mp3' | wc -l

      - name: Fix masks and missing images
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/fix_masks.py "$GITHUB_WORKSPACE/project"

      - name: Download real sound libraries (for SFX)
        run: |
          wget -q -O /tmp/limuy.zip "https://codeload.github.com/limuy2022/PlantsVsZombies/zip/refs/heads/main"
          unzip -q /tmp/limuy.zip -d /tmp/limuy || true
          wget -q -O /tmp/jng.zip "https://codeload.github.com/jiangnangame/New-Plants-vs-Zombies-JavaScript/zip/refs/heads/master"
          unzip -q /tmp/jng.zip -d /tmp/jng || true
          ls /tmp/limuy /tmp/jng 2>/dev/null | head

      - name: Fill audio placeholders
        run: |
          python3 scripts/fill_audio.py "$GITHUB_WORKSPACE/project" \
            $(find /tmp/limuy -type d -name Music 2>/dev/null | head -1) \
            $(find /tmp/jng -type d -name audio 2>/dev/null | head -1)

      - name: Substitute fonts
        run: |
          cp /tmp/font.otf "project/assets/fonts/Bake_Soda.otf"
          cp /tmp/font.otf "project/assets/fonts/SIMSUN.TTC"
          cp /tmp/font.otf "project/assets/fonts/方正少儿_GBK.ttf"
          ls -lh project/assets/fonts

      - name: Patch project (rename, ETC2, preset, custom level)
        run: |
          python3 scripts/patch_project.py "$GITHUB_WORKSPACE/project"
          grep -n "import_etc2_astc" project/project.godot
          ls project/level_game_para
          head -3 project/export_presets.cfg

      - name: Godot editor settings (SDK / Java paths)
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.5.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Debug keystore
        run: |
          keytool -genkey -v -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Import project
        run: |
          ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/project" --import
          echo "import done"

      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/project" \
            --export-debug "Android" "$GITHUB_WORKSPACE/build/PvZ-Full.apk"
          ls -lh build

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PvZ-Full-APK
          path: build/PvZ-Full.apk
          if-no-files-found: error
