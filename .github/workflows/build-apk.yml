name: Build PvZ APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      - name: Install Android SDK bits if missing
        run: |
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMAN" ]; then SDKMAN=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1); fi
          echo "sdkmanager=$SDKMAN"
          yes | "$SDKMAN" --licenses >/dev/null 2>&1 || true
          "$SDKMAN" "platform-tools" "build-tools;34.0.0" "platforms;android-34" >/dev/null 2>&1 || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Download Godot 4.4.1 and export templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q Godot_v4.4.1-stable_export_templates.tpz
          mv templates ~/.local/share/godot/export_templates/4.4.1.stable
          echo "--- templates ---"
          ls ~/.local/share/godot/export_templates/4.4.1.stable | head -20
          test -f ~/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk

      - name: Unzip project
        run: |
          mkdir -p unpack
          unzip -q pvz_project.zip -d unpack
          PROJECT_DIR=$(dirname "$(find unpack -maxdepth 2 -name project.godot | head -1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          ls "$PROJECT_DIR" | head

      - name: Godot editor settings (SDK / Java paths)
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          cat ~/.config/godot/editor_settings-4.4.tres

      - name: Debug keystore
        run: |
          keytool -genkey -v -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          ls -lh "$GITHUB_WORKSPACE/debug.keystore"

      - name: Import project
        run: |
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path "$PROJECT_DIR" --import
          echo "import done"

      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path "$PROJECT_DIR" \
            --export-debug "Android" "$GITHUB_WORKSPACE/build/PvZ.apk"
          ls -lh build

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PvZ-APK
          path: build/PvZ.apk
          if-no-files-found: error
